<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Baseline "light" helps Chromium-family browsers (Brave, Chrome) avoid auto-darkening the page; your toggle still sets dark via Mantine on the root element. -->
    <meta name="color-scheme" content="light" />
    <!-- Same logic as @mantine/core ColorSchemeScript: set data-mantine-color-scheme before React hydrates (localStorage key must match Mantine). -->
    <script data-mantine-script="true">
      try {
        var _colorScheme = window.localStorage.getItem("mantine-color-scheme-value");
        var colorScheme =
          _colorScheme === "light" || _colorScheme === "dark" || _colorScheme === "auto"
            ? _colorScheme
            : "light";
        var computedColorScheme =
          colorScheme !== "auto"
            ? colorScheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-mantine-color-scheme", computedColorScheme);
      } catch (e) {}
    </script>
    <title>Davor Kirbiš | UX Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
