<!DOCTYPE html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply `dark` before React hydrates to avoid a flash. Reads `color-scheme`,
         then the legacy Mantine key so returning visitors keep their choice. -->
    <script>
      try {
        var stored =
          window.localStorage.getItem("color-scheme") ||
          window.localStorage.getItem("mantine-color-scheme-value");
        var scheme =
          stored === "light" || stored === "dark" || stored === "auto" ? stored : "light";
        var computed =
          scheme !== "auto"
            ? scheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.classList.toggle("dark", computed === "dark");
        document.documentElement.setAttribute("data-theme", "default");
        document.documentElement.style.colorScheme = computed;
      } catch (e) {}
    </script>
    <title>Davor Kirbiš | UX Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
